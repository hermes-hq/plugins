name: Build Plugins

on:
  push:
    branches: [main]
    paths:
      - 'plugins/**'
  pull_request:
    branches: [main]
    paths:
      - 'plugins/**'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        plugin: [json-formatter]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        working-directory: plugins/${{ matrix.plugin }}
        run: npm install
      - name: Build
        working-directory: plugins/${{ matrix.plugin }}
        run: npm run build
      - name: Verify output
        working-directory: plugins/${{ matrix.plugin }}
        run: |
          test -f dist/index.js || (echo "Build output missing" && exit 1)
          test -f hermes-plugin.json || (echo "Manifest missing" && exit 1)
      - name: Package
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: plugins/${{ matrix.plugin }}
        run: |
          PLUGIN_ID=$(node -e "console.log(require('./hermes-plugin.json').id)")
          VERSION=$(node -e "console.log(require('./hermes-plugin.json').version)")
          mkdir -p package
          cp hermes-plugin.json package/
          cp -r dist package/
          cd package && tar -czf "../${PLUGIN_ID}-${VERSION}.tgz" .
      - name: Upload artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.plugin }}
          path: plugins/${{ matrix.plugin }}/*.tgz
